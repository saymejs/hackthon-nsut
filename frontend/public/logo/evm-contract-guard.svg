<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ethTop" x1="64" y1="20" x2="96" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#2563eb" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="ethBottom" x1="64" y1="74" x2="90" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d4ed8" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="facetHighlight" x1="40" y1="30" x2="64" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with tactile bevel -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#e8ecf2" />
  <rect x="7" y="7" width="114" height="114" rx="27" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
  <rect x="8" y="8" width="112" height="112" rx="26" stroke="#c8d3e0" stroke-width="1.5" />

  <!-- Outer Vault Vault Brackets (Four Hard Invariant Corners) -->
  <path d="M22 34V24H34" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
  <path d="M106 34V24H94" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
  <path d="M22 94V104H34" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
  <path d="M106 94V104H94" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />

  <!-- Ethereum Diamond Upper Pyramid (Left Facet) -->
  <path d="M64 22L38 65L64 78V22Z" fill="url(#facetHighlight)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Ethereum Diamond Upper Pyramid (Right Facet) -->
  <path d="M64 22L90 65L64 78V22Z" fill="url(#ethTop)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Ethereum Diamond Center Seam Reflection -->
  <path d="M64 22V78" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Ethereum Diamond Lower Pyramid (Left Facet) -->
  <path d="M64 82L38 69L64 106V82Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Ethereum Diamond Lower Pyramid (Right Facet) -->
  <path d="M64 82L90 69L64 106V82Z" fill="url(#ethBottom)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Bytecode Verified Stamp Ring -->
  <circle cx="64" cy="64" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <path d="M28 64H34" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <path d="M94 64H100" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
</svg>
